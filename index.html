                sesion.rutina.items.length + " ejercicios" + (estado === "hecha" ? " ✓" : "");
            celdas.push({ v: texto, s: estiloEstado(wb, estado, false) });
        }
        hoja.fila(celdas, { alto: 46 });
    }
    hoja.fila([], { alto: 10 });
    const stClave = estXL(wb, { bold: true, color: EXCEL_COLOR.gris, border: false, size: 10, h: "right" });
    const stVacio = estXL(wb, { border: false });
    hoja.fila([
        { v: "Leyenda", s: stClave },
        { v: "Completada", s: estiloEstado(wb, "hecha", false) },
        { v: "Hoy", s: estiloEstado(wb, "hoy", false) },
        { v: "No realizada", s: estiloEstado(wb, "perdida", false) },
        { v: "Programada", s: estiloEstado(wb, "programada", false) },
        { v: "Descanso", s: stDescanso },
        { v: "", s: stVacio },
        { v: "", s: stVacio },
    ], { alto: 20 });
    hoja.fila([], { alto: 6 });
    const fRes = filaCabeceras(wb, hoja, ["Resumen", "Valor", "", "", "", "", "", ""]);
    hoja.combinar(fRes, 2, fRes, nCols);
    const filasResumen = [
        ["Sesiones programadas", String(plan.totalSesiones)],
        ["Minutos totales", String(plan.totalMinutos) + " min"],
        ["Sesiones completadas", String(plan.semanas.reduce((a, w) => a + w.sesiones.filter(s => estadoSesion(s, state.routineHistory, hoy) === "hecha").length, 0))],
        ["Zonas trabajadas", plan.zonas.map(z => REGION_LABEL_CORTO[z]).join(", ")],
        ["Origen de las zonas", plan.basadoEnTest ? "Déficits del último test de movilidad" : "Rotación general (aún sin test)"],
        ["Nivel del usuario", NIVEL_LABEL[state.nivel]],
        ["Generado el", fechaExcel(hoy)],
    ];
    filasResumen.forEach((par, i) => {
        const st = estXL(wb, { alt: i % 2 === 1 });
        const f = hoja.fila([{ v: par[0], s: estXL(wb, { bold: true, alt: i % 2 === 1 }) }, { v: par[1], s: st },
            { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }]);
        hoja.combinar(f, 2, f, nCols);
    });
    return hoja;
}
/* --- Hoja tabular: una fila por sesión ----------------------------------- */
function hojaSesiones(wb, plan, state, semanas, nombre) {
    const hoy = todayISO();
    const hoja = wb.hoja(nombre || "Sesiones");
    const cabs = ["Semana", "Fecha", "Día", "Sesión", "Zona", "Contexto", "Duración (min)", "Nº ejercicios", "Tiempo estimado", "Estado"];
    hoja.anchoColumnas([9, 12, 11, 10, 20, 14, 14, 14, 15, 15]);
    const titulo = semanas.length === 1 ? "SESIONES — SEMANA " + semanas[0].numero : "SESIONES DEL PLAN";
    cabeceraHoja(wb, hoja, titulo, resumenPlanTexto(plan), cabs.length);
    const filaCab = filaCabeceras(wb, hoja, cabs);
    hoja.congelarEn(filaCab, 0);
    hoja.filtrar(filaCab, 1, filaCab, cabs.length);
    let n = 0;
    for (const semana of semanas) {
        for (const sesion of semana.sesiones) {
            n++;
            const alt = n % 2 === 0;
            const st = estXL(wb, { alt });
            const stC = estXL(wb, { alt, h: "center" });
            const estado = estadoSesion(sesion, state.routineHistory, hoy);
            hoja.fila([
                { v: semana.numero, s: stC },
                { v: fechaExcel(sesion.fecha), s: stC },
                { v: DIAS_LARGO[sesion.diaSemana], s: st },
                { v: "#" + n, s: stC },
                { v: sesion.zona + (sesion.descarga ? " (descarga)" : ""), s: estXL(wb, { alt, bold: true }) },
                { v: CONTEXTO_LABEL[sesion.contexto], s: st },
                { v: sesion.duracion, s: stC },
                { v: sesion.rutina.items.length, s: stC },
                { v: Math.round(sesion.rutina.duracionEstimadaS / 60) + " min", s: stC },
                { v: ESTADO_SESION_LABEL[estado], s: estiloEstado(wb, estado, alt) },
            ]);
        }
    }
    if (n === 0) {
        const st = estXL(wb, { italic: true, color: EXCEL_COLOR.apagado, h: "center" });
        const f = hoja.fila(Array.from({ length: cabs.length }, (_, i) => ({ v: i === 0 ? "No hay sesiones programadas en este rango." : "", s: st })));
        hoja.combinar(f, 1, f, cabs.length);
    }
    return hoja;
}
/* --- Hoja tabular: una fila por ejercicio -------------------------------- */
function hojaEjercicios(wb, plan, state, semanas, nombre) {
    const hoja = wb.hoja(nombre || "Ejercicios");
    const cabs = ["Semana", "Fecha", "Día", "Zona", "Nº", "Ejercicio", "Región", "Subregión",
        "Descripción", "Dosis", "Modo", "Evidencia", "Vídeo"];
    hoja.anchoColumnas([8, 12, 11, 18, 5, 34, 17, 22, 52, 18, 15, 20, 42]);
    cabeceraHoja(wb, hoja, "EJERCICIO A EJERCICIO", resumenPlanTexto(plan), cabs.length);
    const filaCab = filaCabeceras(wb, hoja, cabs);
    hoja.congelarEn(filaCab, 0);
    hoja.filtrar(filaCab, 1, filaCab, cabs.length);
    let bloque = 0;
    for (const semana of semanas) {
        for (const sesion of semana.sesiones) {
            bloque++;
            const alt = bloque % 2 === 0; // zebra por sesión, no por fila: agrupa visualmente
            const st = estXL(wb, { alt });
            const stC = estXL(wb, { alt, h: "center" });
            if (!sesion.rutina.items.length) {
                hoja.fila([{ v: semana.numero, s: stC }, { v: fechaExcel(sesion.fecha), s: stC },
                    { v: DIAS_LARGO[sesion.diaSemana], s: st }, { v: sesion.zona, s: st }, { v: "", s: stC },
                    { v: "Sin ejercicios disponibles para tu nivel/contexto", s: estXL(wb, { alt, italic: true, color: EXCEL_COLOR.apagado }) },
                    { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }, { v: "", s: st }]);
                continue;
            }
            for (const item of sesion.rutina.items) {
                const ex = item.exercise;
                hoja.fila([
                    { v: semana.numero, s: stC },
                    { v: fechaExcel(sesion.fecha), s: stC },
                    { v: DIAS_LARGO[sesion.diaSemana], s: st },
                    { v: sesion.zona, s: st },
                    { v: item.orden, s: stC },
                    { v: ex.nombre, s: estXL(wb, { alt, bold: true }) },
                    { v: ex.region, s: st },
                    { v: ex.subregion, s: st },
                    { v: ex.descripcion || "", s: st },
                    { v: ex.dosis || "", s: st },
                    { v: ex.modo || "", s: st },
                    { v: ex.evidencia || "", s: st },
                    { v: ex.videoUrl || "", s: estXL(wb, { alt, color: "2A5DB0", size: 10 }) },
                ]);
            }
        }
    }
    return hoja;
}
/* --- Hoja de detalle semanal: bloques por día con celdas combinadas ------- */
function hojaSemanaDetalle(wb, plan, semana, state) {
    const hoy = todayISO();
    const hoja = wb.hoja("Semana " + semana.numero);
    const cabs = ["Día", "Fecha", "Sesión", "Nº", "Ejercicio", "Región / subregión", "Dosis", "Modo", "Evidencia", "Vídeo"];
    hoja.anchoColumnas([13, 12, 22, 5, 36, 26, 19, 15, 20, 40]);
    const sub = "Semana " + semana.numero + " de " + plan.config.semanas + "  ·  " + rangoLegible(semana.inicio, semana.fin) +
        "  ·  " + semana.sesiones.length + " sesiones  ·  " + semana.minutos + " min  ·  " +
        CONTEXTO_LABEL[plan.config.contexto] + (semana.descarga ? "  ·  semana de descarga" : "");
    cabeceraHoja(wb, hoja, "SEMANA " + semana.numero + " — PLAN DE MOVILIDAD", sub, cabs.length);
    const filaCab = filaCabeceras(wb, hoja, cabs);
    hoja.congelarEn(filaCab, 0);
    let bloque = 0;
    for (let off = 0; off < 7; off++) {
        const fecha = sumarDiasISO(semana.inicio, off);
        const sesion = semana.sesiones.find(s => s.fecha === fecha);
        const stDia = estXL(wb, { bold: true, color: "FFFFFF", fill: EXCEL_COLOR.pizarra, borderColor: EXCEL_COLOR.pizarra, h: "center" });
        if (!sesion) {
            const stApagado = estXL(wb, { color: EXCEL_COLOR.apagado, fill: "FBFCFD", h: "center" });
            const stDescanso = estXL(wb, { color: EXCEL_COLOR.apagado, italic: true, fill: "FBFCFD" });
            const f = hoja.fila([
                { v: DIAS_LARGO[diaSemanaISO(fecha)], s: stApagado },
                { v: fechaExcel(fecha), s: stApagado },
                { v: "Descanso", s: stDescanso },
            ].concat(Array.from({ length: cabs.length - 3 }, () => ({ v: "", s: stDescanso }))), { alto: 20 });
            hoja.combinar(f, 3, f, cabs.length);
            continue;
        }
        bloque++;
        const alt = bloque % 2 === 0;
        const estado = estadoSesion(sesion, state.routineHistory, hoy);
        const items = sesion.rutina.items;
        const stFija = estXL(wb, { bold: true, alt, v: "center", h: "center" });
        const stCuerpo = estXL(wb, { alt });
        const stCentro = estXL(wb, { alt, h: "center" });
        const etiquetaSesion = REGION_LABEL_CORTO[sesion.zona] + " · " + sesion.duracion + " min\n" + ESTADO_SESION_LABEL[estado];
        if (!items.length) {
            hoja.fila([{ v: DIAS_LARGO[sesion.diaSemana], s: stDia }, { v: fechaExcel(fecha), s: stFija },
                { v: etiquetaSesion, s: stFija },
                { v: "", s: stCentro }, { v: "Sin ejercicios disponibles para tu nivel/contexto", s: stCuerpo },
                { v: "", s: stCuerpo }, { v: "", s: stCuerpo }, { v: "", s: stCuerpo }, { v: "", s: stCuerpo }, { v: "", s: stCuerpo }]);
            continue;
        }
        let primera = 0;
        items.forEach((item, i) => {
            const ex = item.exercise;
            const f = hoja.fila([
                { v: i === 0 ? DIAS_LARGO[sesion.diaSemana] : "", s: stDia },
                { v: i === 0 ? fechaExcel(fecha) : "", s: stFija },
                { v: i === 0 ? etiquetaSesion : "", s: stFija },
                { v: item.orden, s: stCentro },
                { v: ex.nombre, s: estXL(wb, { alt, bold: true }) },
                { v: ex.region + " / " + ex.subregion, s: stCuerpo },
                { v: ex.dosis || "", s: stCuerpo },
                { v: ex.modo || "", s: stCuerpo },
                { v: ex.evidencia || "", s: stCuerpo },
                { v: ex.videoUrl || "", s: estXL(wb, { alt, color: "2A5DB0", size: 10 }) },
            ]);
            if (i === 0)
                primera = f;
            if (i === items.length - 1 && items.length > 1) {
                hoja.combinar(primera, 1, f, 1);
                hoja.combinar(primera, 2, f, 2);
                hoja.combinar(primera, 3, f, 3);
            }
        });
    }
    return hoja;
}
function nombreArchivoSeguro(s) { return String(s).replace(/[^\w.-]+/g, "-"); }
function exportarPlanMesExcel(plan, state) {

/* ============================================================================
   EXPORTACIÓN A EXCEL — escritor .xlsx nativo, sin dependencias externas.
   Genera un OOXML SpreadsheetML mínimo pero con estilos (fuentes, rellenos,
   bordes, alineación), anchos de columna, celdas combinadas, paneles fijos y
   autofiltro. Se empaqueta en un ZIP (método "store", sin compresión) escrito
   a mano para no depender de ninguna librería.
   ========================================================================== */
const XLSX_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
function xmlEscape(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
}
function argb(color) {
    const c = String(color).replace("#", "").toUpperCase();
    return c.length === 6 ? "FF" + c : c;
}
function colName(n) { // 1 -> A, 27 -> AA
    let s = "";
    while (n > 0) {
        const r = (n - 1) % 26;
        s = String.fromCharCode(65 + r) + s;
        n = Math.floor((n - 1) / 26);
    }
    return s;
}
const cellRef = (row, col) => colName(col) + row;
/* --- registro de estilos ------------------------------------------------- */
function crearRegistroEstilos() {
    const fonts = ['<font><sz val="11"/><color rgb="FF1D242C"/><name val="Calibri"/></font>'];
    const fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    const borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    const xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    const cache = new Map();
    const push = (arr, xml) => { const i = arr.indexOf(xml); if (i >= 0) return i; arr.push(xml); return arr.length - 1; };
    function estilo(def) {
        const key = JSON.stringify(def || {});
        if (cache.has(key)) return cache.get(key);
        const d = def || {};
        const f = d.font || {};
        const fontId = push(fonts, "<font>" + (f.bold ? "<b/>" : "") + (f.italic ? "<i/>" : "") +
            '<sz val="' + (f.size || 11) + '"/><color rgb="' + argb(f.color || "1D242C") + '"/>' +
            '<name val="' + (f.name || "Calibri") + '"/></font>');
        const fillId = d.fill
            ? push(fills, '<fill><patternFill patternType="solid"><fgColor rgb="' + argb(d.fill) + '"/><bgColor indexed="64"/></patternFill></fill>')
            : 0;
        let borderId = 0;
        if (d.border) {
            const estilo_ = d.border === true ? "thin" : d.border;
            const c = argb(d.borderColor || "D8DCE2");
            const lado = (t) => "<" + t + ' style="' + estilo_ + '"><color rgb="' + c + '"/></' + t + ">";
            borderId = push(borders, "<border>" + lado("left") + lado("right") + lado("top") + lado("bottom") + "<diagonal/></border>");
        }
        const a = d.align;
        const alignXml = a
            ? "<alignment" + (a.h ? ' horizontal="' + a.h + '"' : "") + (a.v ? ' vertical="' + a.v + '"' : "") +
                (a.wrap ? ' wrapText="1"' : "") + (a.indent ? ' indent="' + a.indent + '"' : "") + "/>"
            : "";
        const xf = '<xf numFmtId="' + (d.numFmtId || 0) + '" fontId="' + fontId + '" fillId="' + fillId +
            '" borderId="' + borderId + '" xfId="0" applyFont="1"' +
            (fillId ? ' applyFill="1"' : "") + (borderId ? ' applyBorder="1"' : "") +
            (alignXml ? ' applyAlignment="1"' : "") + (d.numFmtId ? ' applyNumberFormat="1"' : "") +
            (alignXml ? ">" + alignXml + "</xf>" : "/>");
        const id = push(xfs, xf);
        cache.set(key, id);
        return id;
    }
    function xml() {
        return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<styleSheet xmlns="' + XLSX_NS + '">' +
            '<numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts>' +
            '<fonts count="' + fonts.length + '">' + fonts.join("") + "</fonts>" +
            '<fills count="' + fills.length + '">' + fills.join("") + "</fills>" +
            '<borders count="' + borders.length + '">' + borders.join("") + "</borders>" +
            '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
            '<cellXfs count="' + xfs.length + '">' + xfs.join("") + "</cellXfs>" +
            '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
            "</styleSheet>";
    }
    return { estilo, xml };
}
/* --- hoja ---------------------------------------------------------------- */
function crearHoja(nombre) {
    const filas = [];
    const merges = [];
    let anchos = [];
    let congelar = null;
    let autoFiltro = null;
    const hoja = {
        nombre,
        get numFilas() { return filas.length; },
        anchoColumnas(ws) { anchos = ws; return hoja; },
        congelarEn(fila, col) { congelar = { fila: fila || 0, col: col || 0 }; return hoja; },
        filtrar(f1, c1, f2, c2) { autoFiltro = cellRef(f1, c1) + ":" + cellRef(f2, c2); return hoja; },
        // celdas: array de {v, s} | valor plano | null
        fila(celdas, opts) {
            filas.push({ celdas: celdas || [], alto: (opts && opts.alto) || null });
            return filas.length; // índice 1-based de la fila añadida
        },
        combinar(f1, c1, f2, c2) { merges.push(cellRef(f1, c1) + ":" + cellRef(f2, c2)); return hoja; },
        xml() {
            let maxCol = 1;
            const filasXml = filas.map((f, i) => {
                const r = i + 1;
                const cs = f.celdas.map((celda, j) => {
                    if (celda == null) return "";
                    const c = (typeof celda === "object" && !(celda instanceof Date)) ? celda : { v: celda };
                    const col = j + 1;
                    if (col > maxCol) maxCol = col;
                    const ref = cellRef(r, col);
                    const s = c.s ? ' s="' + c.s + '"' : "";
                    if (c.v == null || c.v === "") return "<c r=\"" + ref + "\"" + s + "/>";
                    if (typeof c.v === "number" && isFinite(c.v)) return "<c r=\"" + ref + "\"" + s + "><v>" + c.v + "</v></c>";
                    return "<c r=\"" + ref + "\"" + s + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(c.v) + "</t></is></c>";
                }).join("");
                const alto = f.alto ? ' ht="' + f.alto + '" customHeight="1"' : "";
                return '<row r="' + r + '"' + alto + ">" + cs + "</row>";
            }).join("");
            const colsXml = anchos.length
                ? "<cols>" + anchos.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join("") + "</cols>"
                : "";
            let panesXml = "";
            if (congelar && (congelar.fila || congelar.col)) {
                const top = cellRef(congelar.fila + 1, congelar.col + 1);
                const panelActivo = congelar.col && congelar.fila ? "bottomRight" : congelar.col ? "topRight" : "bottomLeft";
                panesXml = "<pane" + (congelar.col ? ' xSplit="' + congelar.col + '"' : "") +
                    (congelar.fila ? ' ySplit="' + congelar.fila + '"' : "") +
                    ' topLeftCell="' + top + '" activePane="' + panelActivo + '" state="frozen"/>' +
                    '<selection pane="' + panelActivo + '" activeCell="' + top + '" sqref="' + top + '"/>';
            }
            const dim = "A1:" + cellRef(Math.max(filas.length, 1), maxCol);
            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<worksheet xmlns="' + XLSX_NS + '">' +
                '<dimension ref="' + dim + '"/>' +
                '<sheetViews><sheetView showGridLines="0" workbookViewId="0">' + panesXml + "</sheetView></sheetViews>" +
                '<sheetFormatPr defaultRowHeight="15"/>' +
                colsXml +
                "<sheetData>" + filasXml + "</sheetData>" +
                (autoFiltro ? '<autoFilter ref="' + autoFiltro + '"/>' : "") +
                (merges.length ? '<mergeCells count="' + merges.length + '">' + merges.map(m => '<mergeCell ref="' + m + '"/>').join("") + "</mergeCells>" : "") +
                '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>' +
                "</worksheet>";
        },
    };
    return hoja;
}
/* --- libro --------------------------------------------------------------- */
function crearLibro() {
    const hojas = [];
    const estilos = crearRegistroEstilos();
    return {
        estilo: estilos.estilo,
        hoja(nombre) {
            // Excel limita los nombres de hoja a 31 caracteres y prohíbe : \ / ? * [ ]
            const limpio = String(nombre).replace(/[:\\\/?*\[\]]/g, "-").slice(0, 31) || "Hoja";
            const h = crearHoja(limpio);
            hojas.push(h);
            return h;
        },
        bytes() {
            const archivos = [];
            const add = (nombre, texto) => archivos.push({ nombre, datos: new TextEncoder().encode(texto) });
            const sheetTags = hojas.map((h, i) => '<sheet name="' + xmlEscape(h.nombre) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join("");
            const relTags = hojas.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join("");
            add("[Content_Types].xml",
                '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
                '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                '<Default Extension="xml" ContentType="application/xml"/>' +
                '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
                hojas.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
                '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
                "</Types>");
            add("_rels/.rels",
